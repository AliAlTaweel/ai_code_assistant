services:
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: agileday_local
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    volumes:
      - agileday_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d agileday_local"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  agileday_pg_data:
